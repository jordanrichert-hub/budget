name: Deploy Budget to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # --- 1. RUN YOUR SCRIPT/PROCESS HERE ---
      - name: Run daily transaction update
        run: |
          # Replace this line with the actual command that runs your script
          node update-script.js 

      # --- 2. COMMIT AND PUSH THE NEW DATA BACK TO REPO ---
      - name: Commit and push updated transaction data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update daily transaction dashboard [skip ci]" || exit 0
          git push

      # --- 3. EXISTING GITHUB PAGES DEPLOYMENT STEPS ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
