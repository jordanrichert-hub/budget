name: Daily Budget Auto-Update

on:
  schedule:
    - cron: '0 14 * * *' # Runs daily at 2:00 PM UTC (9:00 AM EST)
  workflow_dispatch: # Allows you to trigger it manually anytime from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # (Optional placeholder for your update script if you add one later)
      - name: Run update check
        run: |
          echo "Running daily scheduled check..."

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update daily transaction dashboard [skip ci]" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
